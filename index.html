<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omar System Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pharmacy.css">
<link rel="stylesheet" href="css/private.css">
<style>
:root{--bg:#f6f7f9;--card:#ffffff;--border:#eceef2;--text:#0f172a;--muted:#64748b;--primary:#111827;--accent:#7c3aed}
*{font-family:'Tajawal',system-ui!important;box-sizing:border-box}
body{background:var(--bg)!important;color:var(--text)!important;margin:0!important}
.app-container{max-width:1280px;margin:0 auto;padding:16px 16px 100px 16px!important}

/* Top App Switcher */
.top-switch{
  display:flex;gap:8px;background:var(--card);border:1px solid var(--border);
  padding:6px;border-radius:16px;box-shadow:0 2px 20px rgba(0,0,0,.04);
  position:sticky;top:12px;z-index:50
}
.top-btn{
  flex:1;height:44px;border-radius:12px!important;border:1px solid transparent!important;
  background:transparent!important;color:var(--muted)!important;font-weight:700!important;
  font-size:15px!important;transition:.2s;box-shadow:none!important
}
.top-btn.active{background:var(--primary)!important;color:#fff!important;box-shadow:0 6px 16px rgba(0,0,0,.15)!important}

/* Sub Nav */
.nav-bar{
  display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap!important;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:8px!important;margin:14px 0!important;box-shadow:0 2px 16px rgba(0,0,0,.03)
}
.nav-bar::-webkit-scrollbar{display:none}
.nav-tab{
  flex:0 0 auto;white-space:nowrap;height:38px;padding:0 16px!important;
  border-radius:10px!important;background:#f8f9fb!important;border:1px solid var(--border)!important;
  color:var(--muted)!important;font-weight:700!important;font-size:13px!important;box-shadow:none!important
}
.nav-tab.active{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}

/* Content Card */
.content{
  background:var(--card)!important;border:1px solid var(--border)!important;
  border-radius:20px!important;box-shadow:0 8px 32px rgba(15,23,42,.06)!important;
  padding:0!important;overflow:hidden!important
}
.tab-content{padding:16px}
.tab-content.card, table{
  background:#fff!important;border:1px solid var(--border)!important;border-radius:14px!important;overflow:hidden
}
table{width:100%!important;border-collapse:separate!important;border-spacing:0!important}
table th{background:#f8f9fb!important;color:var(--muted)!important;font-weight:700!important;font-size:12px!important;letter-spacing:.3px;text-transform:uppercase;padding:12px 10px!important;border-bottom:1px solid var(--border)!important}
table td{padding:12px 10px!important;border-bottom:1px solid #f3f4f6!important;font-size:14px!important}
table tr:last-child td{border-bottom:none!important}
table input, table select{
  background:#fff!important;border:1px solid var(--border)!important;border-radius:10px!important;
  padding:8px 10px!important;font-size:14px!important;transition:.15s
}
table input:focus{border-color:var(--accent)!important;box-shadow:0 0 0 4px rgba(124,58,237,.1)!important;outline:none!important}

/* Private section fix */
#private.card, #private [class*="card"]{border-radius:16px!important;border:1px solid var(--border)!important}
#private button{border-radius:12px!important;font-weight:700!important}

/* Export FAB */
#unified-all-global{
  position:fixed!important;left:16px!important;right:16px!important;bottom:16px!important;
  width:auto!important;height:56px!important;background:#111827!important;color:#fff!important;
  border:none!important;border-radius:16px!important;font-weight:800!important;font-size:15px!important;
  box-shadow:0 12px 32px rgba(0,0,0,.22)!important;z-index:9999!important
}

@media(min-width:769px){
  #unified-all-global{left:24px!important;right:auto!important;width:220px!important}
 .top-switch{top:16px}
}
@media(max-width:768px){
 .app-container{padding:10px 10px 90px 10px!important}
 .content{border-radius:18px!important}
 .tab-content{padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:700px!important}
}
</style>
</head>
<body>
<div class="app-container">
<div class="top-switch">
<button class="top-btn active" data-top="pharmacy">💊 الصيدلية</button>
<button class="top-btn" data-top="private">👤 الخاص</button>
</div>
<div id="pharmacyApp">
<div class="nav-bar" id="navBar">
<button class="nav-tab active" data-tab="daily">📅 اليومية</button>
<button class="nav-tab" data-tab="total">📊 الاجمالي</button>
<button class="nav-tab" data-tab="purchases">🧾 المشتريات</button>
<button class="nav-tab" data-tab="sales">📦 المبيعات للمخزن</button>
<button class="nav-tab" data-tab="database">🗄 قواعد البيانات</button>
</div>
<div class="content">
<div id="daily" class="tab-content active"></div>
<div id="total" class="tab-content"></div>
<div id="purchases" class="tab-content"></div>
<div id="sales" class="tab-content"></div>
<div id="database" class="tab-content"></div>
</div>
</div>
<div id="privateApp" style="display:none"><div id="private"></div></div>
</div>
<button id="unified-all-global" onclick="unifiedExportAll()">📦 تصدير كله XLSX</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/pharmacy/googleSync.js?v=30"></script>
<script src="js/pharmacy/daily.js?v=30"></script>
<script src="js/pharmacy/total.js?v=30"></script>
<script src="js/pharmacy/purchases.js?v=30"></script>
<script src="js/pharmacy/sales.js?v=30"></script>
<script src="js/pharmacy/database.js?v=30"></script>
<script src="js/pharmacy/actions.js?v=30"></script>
<script src="js/private/private.js?v=30"></script>
<script src="js/private/masrofaty.js?v=30"></script>
<script src="js/private/dyon.js?v=30"></script>
<script src="js/private/hodor.js?v=30"></script>
<script src="js/private/notes.js?v=30"></script>
<script type="module" src="firebase-config.js?v=30"></script>
<script type="module" src="app.js?v=30"></script>

<script>
function getStore(n){try{let v=localStorage.getItem(n);if(v)return JSON.parse(v);}catch(e){}return null;}
function deepParse(v){try{if(typeof v==='string'){let t=v.trim();if(t.startsWith('{')||t.startsWith('['))return JSON.parse(t);}}catch(e){}return v;}
function normalize(s){if(!s)return[];let arr=Array.isArray(s)?s:Object.values(s);return arr.map(v=>{let d=deepParse(v);if(typeof d==='string')d=deepParse(d);return d;}).filter(Boolean);}
window.unifiedExportAll=function(){
 try{
  if(typeof XLSX==='undefined'){alert('استنى ثانيتين');return;}
  let wb=XLSX.utils.book_new();
  let store=getStore('dailyStore')||{};let r1=[['التاريخ','الموظف','الشيفت','العجز','المورد','القيمة']];
  Object.keys(store).forEach(k=>{let d=store[k];let arr=Array.isArray(d)?d:Object.values(d||{});let rows={};arr.forEach(it=>{if(!it||!it.id)return;let m=(it.id+'').match(/t1_r(\d+)_c(\d+)/);if(!m)return;let R=m[1],C=m[2];if(!rows[R])rows[R]={emp:'',shift:'',diff:'',sup:'',val:''};if(C==='1')rows[R].emp=it.val||'';if(C==='2')rows[R].shift=it.val||'';if(C==='3')rows[R].diff=it.val||'';if(C==='5')rows[R].sup=it.val||'';if(C==='6')rows[R].val=it.val||'';});Object.values(rows).forEach(x=>{if(x.emp||x.val)r1.push([k,x.emp,x.shift,x.diff,x.sup,x.val]);});});
  if(r1.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r1),'1- اليومية');
  let purch=getStore('purchaseStore')||[];if(purch.length){let r=[['التاريخ','المورد','النوع','طريقة الدفع','القيمة']];purch.forEach(o=>r.push([o.date||'',o.supplier||'',o.type||'',o.pay||'',o.value||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'2- المشتريات');}
  let pStore=getStore('privateStore');if(pStore){let list=normalize(pStore);let m=list.filter(o=>!(o.bayan||'').includes('ديون'));let d=list.filter(o=>(o.bayan||'').includes('ديون'));if(m.length){let r=[['التاريخ','البيان','المبلغ','الفئة','طريقة الدفع']];m.forEach(o=>r.push([o.date||'',o.bayan||'',o.amount||'',o.cat||'',o.pay||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'3- مصروفاتي');}if(d.length){let r=[['التاريخ','البيان','المبلغ','الدكتور','طريقة الدفع']];d.forEach(o=>r.push([o.date||'',o.bayan||'',o.amount||'',o.cat||'',o.pay||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'4- الديون');}}
  let fixed=getStore('monthlyFixed_v16')||getStore('monthlyFixed_v3');if(fixed){let arr=normalize(fixed);if(arr.length&&arr[0].name){let r=[['البند','المبلغ']];arr.forEach(o=>r.push([o.name||'',o.amount||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'7- ثابتة');}}
  XLSX.writeFile(wb,'Omar-Pro-'+new Date().toISOString().slice(0,10)+'.xlsx');
  alert('✅ اتصدر:\n'+wb.SheetNames.join('\n'));
 }catch(e){alert(e.message)}
};
function showTab(n){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));document.getElementById(n)?.classList.add('active');document.querySelector(`[data-tab="${n}"]`)?.classList.add('active');if(n==='daily'&&typeof renderDaily==='function')renderDaily();if(n==='total'&&typeof renderTotal==='function')renderTotal();if(n==='purchases'&&typeof renderPurchases==='function')renderPurchases();if(n==='sales'&&typeof renderSales==='function')renderSales();if(n==='database'&&typeof renderDatabase==='function')renderDatabase();}
function showTop(m){document.querySelectorAll('.top-btn').forEach(b=>b.classList.remove('active'));if(m==='pharmacy'){document.getElementById('pharmacyApp').style.display='block';document.getElementById('privateApp').style.display='none';document.querySelector('[data-top="pharmacy"]').classList.add('active');showTab('daily');}else{document.getElementById('pharmacyApp').style.display='none';document.getElementById('privateApp').style.display='block';document.querySelector('[data-top="private"]').classList.add('active');if(typeof renderPrivate==='function')renderPrivate();}}
document.querySelectorAll('.nav-tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));document.querySelectorAll('.top-btn').forEach(b=>b.addEventListener('click',()=>showTop(b.dataset.top)));
window.addEventListener('load',async()=>{if(typeof fetchSheetData==='function')await fetchSheetData();showTop('pharmacy');});
</script>
</body>
</html>
