<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar System</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pharmacy.css">
<link rel="stylesheet" href="css/private.css">
<style>
.tab-content{display:none}.tab-content.active{display:block}
#unified-all-global{position:fixed;bottom:20px;left:20px;z-index:999999;background:#000;color:#fff;border:none;padding:14px 24px;border-radius:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* موبايل بسيط آمن - مش بيكسر جدول */
@media(max-width:768px){
.app-container{padding:8px!important}
.top-switch{display:flex;gap:6px;position:sticky;top:0;z-index:99;background:#fff;padding:6px;border-radius:14px;border:1px solid #eee}
.top-btn{flex:1;border-radius:10px!important;padding:12px!important}
.nav-bar{display:flex;flex-wrap:nowrap!important;overflow-x:auto!important;gap:6px;padding-bottom:6px}
.nav-bar::-webkit-scrollbar{display:none}
.nav-tab{flex:0 0 auto;white-space:nowrap}
.content{overflow-x:auto!important}
</style>
</head>
<body>
<div class="app-container">
<div class="top-switch">
<button class="top-btn active" data-top="pharmacy">💊 الصيدلية</button>
<button class="top-btn" data-top="private">الخاص</button>
</div>
<div id="pharmacyApp">
<div class="nav-bar" id="navBar">
<button class="nav-tab active" data-tab="daily">📅 اليومية</button>
<button class="nav-tab" data-tab="total">📊 الاجمالي</button>
<button class="nav-tab" data-tab="purchases">🧾 المشتريات</button>
<button class="nav-tab" data-tab="sales">📦 المبيعات للمخزن</button>
<button class="nav-tab" data-tab="database">🗄 قواعد البيانات</button>
</div>
<div class="content">
<div id="daily" class="tab-content active"></div>
<div id="total" class="tab-content"></div>
<div id="purchases" class="tab-content"></div>
<div id="sales" class="tab-content"></div>
<div id="database" class="tab-content"></div>
</div>
</div>
<div id="privateApp" style="display:none"><div id="private"></div></div>
</div>
<button id="unified-all-global" onclick="unifiedExportAll()">📦 تصدير كله XLSX</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/pharmacy/googleSync.js?v=29"></script>
<script src="js/pharmacy/daily.js?v=29"></script>
<script src="js/pharmacy/total.js?v=29"></script>
<script src="js/pharmacy/purchases.js?v=29"></script>
<script src="js/pharmacy/sales.js?v=29"></script>
<script src="js/pharmacy/database.js?v=29"></script>
<script src="js/pharmacy/actions.js?v=29"></script>
<script src="js/private/private.js?v=29"></script>
<script src="js/private/masrofaty.js?v=29"></script>
<script src="js/private/dyon.js?v=29"></script>
<script src="js/private/hodor.js?v=29"></script>
<script src="js/private/notes.js?v=29"></script>
<script type="module" src="firebase-config.js?v=29"></script>
<script type="module" src="app.js?v=29"></script>

<script>
// === V29 كامل سليم + تصدير عربي ===
function getStore(n){try{let v=localStorage.getItem(n);if(v)return JSON.parse(v);}catch(e){}return null;}
function deepParse(v){try{if(typeof v==='string'){let t=v.trim();if(t.startsWith('{')||t.startsWith('['))return JSON.parse(t);}}catch(e){}return v;}
function normalize(s){if(!s)return[];let arr=Array.isArray(s)?s:Object.values(s);return arr.map(v=>{let d=deepParse(v);if(typeof d==='string')d=deepParse(d);return d;}).filter(Boolean);}
window.unifiedExportAll=function(){
 try{
  if(typeof XLSX==='undefined'){alert('استنى ثانيتين');return;}
  let wb=XLSX.utils.book_new();
  let store=getStore('dailyStore')||{};let r1=[['التاريخ','الموظف','الشيفت','العجز','المورد','القيمة']];
  Object.keys(store).forEach(k=>{let d=store[k];let arr=Array.isArray(d)?d:Object.values(d||{});let rows={};arr.forEach(it=>{if(!it||!it.id)return;let m=(it.id+'').match(/t1_r(\d+)_c(\d+)/);if(!m)return;let R=m[1],C=m[2];if(!rows[R])rows[R]={emp:'',shift:'',diff:'',sup:'',val:''};if(C==='1')rows[R].emp=it.val||'';if(C==='2')rows[R].shift=it.val||'';if(C==='3')rows[R].diff=it.val||'';if(C==='5')rows[R].sup=it.val||'';if(C==='6')rows[R].val=it.val||'';});Object.values(rows).forEach(x=>{if(x.emp||x.val)r1.push([k,x.emp,x.shift,x.diff,x.sup,x.val]);});});
  if(r1.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r1),'1- اليومية 211 يوم');
  let purch=getStore('purchaseStore')||[];if(purch.length){let r=[['التاريخ','المورد','النوع','طريقة الدفع','القيمة']];purch.forEach(o=>r.push([o.date||'',o.supplier||'',o.type||'',o.pay||'',o.value||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'2- المشتريات');}
  let pStore=getStore('privateStore');if(pStore){let list=normalize(pStore);let m=list.filter(o=>!(o.bayan||'').includes('ديون'));let d=list.filter(o=>(o.bayan||'').includes('ديون'));if(m.length){let r=[['التاريخ','البيان','المبلغ','الفئة','طريقة الدفع']];m.forEach(o=>r.push([o.date||'',o.bayan||'',o.amount||'',o.cat||'',o.pay||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'3- مصروفاتي الخاصة');}if(d.length){let r=[['التاريخ','البيان','المبلغ','الدكتور / الفئة','طريقة الدفع']];d.forEach(o=>r.push([o.date||'',o.bayan||'',o.amount||'',o.cat||'',o.pay||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'4- الديون');}}
  let fixed=getStore('monthlyFixed_v16')||getStore('monthlyFixed_v3');if(fixed){let arr=normalize(fixed);if(arr.length&&arr[0].name){let r=[['البند','المبلغ']];arr.forEach(o=>r.push([o.name||'',o.amount||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'7- المصاريف الثابتة');}}
  let db=getStore('dbStore')||{};if(db.suppliers?.length){let r=[['اسم المورد','التصنيف']];db.suppliers.forEach(s=>r.push([s.name||'',s.category||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'8- الموردين');}
  XLSX.writeFile(wb,'Omar-كامل-'+new Date().toISOString().slice(0,10)+'.xlsx');
  alert('✅ اتصدر:\n'+wb.SheetNames.join('\n'));
 }catch(e){alert(e.message)}
};
function showTab(name){
 document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
 document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
 document.getElementById(name)?.classList.add('active');
 document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');
 if(name==='daily'&&typeof renderDaily==='function')renderDaily();
 if(name==='total'&&typeof renderTotal==='function')renderTotal();
 if(name==='purchases'&&typeof renderPurchases==='function')renderPurchases();
 if(name==='sales'&&typeof renderSales==='function')renderSales();
 if(name==='database'&&typeof renderDatabase==='function')renderDatabase();
}
function showTop(mode){
 document.querySelectorAll('.top-btn').forEach(b=>b.classList.remove('active'));
 if(mode==='pharmacy'){
  document.getElementById('pharmacyApp').style.display='block';
  document.getElementById('privateApp').style.display='none';
  document.querySelector('[data-top="pharmacy"]').classList.add('active');
  showTab('daily');
 }else{
  document.getElementById('pharmacyApp').style.display='none';
  document.getElementById('privateApp').style.display='block';
  document.querySelector('[data-top="private"]').classList.add('active');
  if(typeof renderPrivate==='function')renderPrivate();
 }
}
document.querySelectorAll('.nav-tab').forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.tab)));
document.querySelectorAll('.top-btn').forEach(btn=>btn.addEventListener('click',()=>showTop(btn.dataset.top)));
window.addEventListener('load',async()=>{
 if(typeof fetchSheetData==='function')await fetchSheetData();
 showTop('pharmacy');
});
</script>
</body>
</html>
