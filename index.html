<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar System Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pharmacy.css?v=31">
<link rel="stylesheet" href="css/private.css?v=31">
<style>
:root{--card:#fff;--b:#eef0f4;--t:#0f172a;--m:#64748b;--p:#000;--a:#7c3aed}
body{background:#f5f7fb!important;color:var(--t)!important}
.app-container{max-width:1300px;margin:0 auto;padding:12px 12px 90px 12px!important}
.tab-content{display:none}.tab-content.active{display:block}

/* Top Switch */
.top-switch{display:flex!important;gap:8px;background:var(--card);border:1px solid var(--b);padding:6px;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.05);position:sticky;top:10px;z-index:100}
.top-btn{flex:1;height:48px;border-radius:12px!important;border:0!important;background:#f1f3f6!important;color:var(--m)!important;font-weight:800!important;font-size:15px!important}
.top-btn.active{background:var(--p)!important;color:#fff!important}

/* MAIN TABS - اجباري تظهر */
#navBar.nav-bar{
 display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;
 gap:8px!important;background:var(--card)!important;border:1px solid var(--b)!important;
 border-radius:16px!important;padding:8px!important;margin:12px 0!important;
 opacity:1!important;visibility:visible!important;height:auto!important
}
#navBar::-webkit-scrollbar{display:none}
.nav-tab{
 display:inline-flex!important;align-items:center;justify-content:center;
 flex:0 0 auto!important;white-space:nowrap!important;
 height:40px!important;padding:0 18px!important;border-radius:12px!important;
 background:#f6f7f9!important;border:1px solid var(--b)!important;color:var(--m)!important;
 font-weight:700!important;font-size:13px!important;opacity:1!important
}
.nav-tab.active{background:var(--a)!important;color:#fff!important;border-color:var(--a)!important}

/* Content */
.content{background:var(--card)!important;border:1px solid var(--b)!important;border-radius:20px!important;box-shadow:0 8px 30px rgba(0,0,0,.06)!important;padding:0!important;overflow:hidden!important}
.tab-content{padding:12px!important;overflow-x:auto!important}
table{width:100%!important;min-width:680px!important}
table th{font-size:12px!important;color:var(--m)!important;background:#f8f9fb!important}
#unified-all-global{position:fixed!important;left:12px!important;right:12px!important;bottom:12px!important;height:56px!important;background:#000!important;color:#fff!important;border-radius:16px!important;font-weight:800!important;z-index:9999!important;box-shadow:0 12px 32px rgba(0,0,0,.25)!important}
@media(min-width:769px){#unified-all-global{left:20px!important;right:auto!important;width:240px!important}}
@media(max-width:768px){.app-container{padding:8px 8px 90px 8px!important}}
</style>
</head>
<body>
<div class="app-container">
<div class="top-switch">
<button class="top-btn active" data-top="pharmacy">💊 الصيدلية</button>
<button class="top-btn" data-top="private">👤 الخاص</button>
</div>
<div id="pharmacyApp">
<div class="nav-bar" id="navBar">
<button class="nav-tab active" data-tab="daily">📅 اليومية</button>
<button class="nav-tab" data-tab="total">📊 الاجمالي</button>
<button class="nav-tab" data-tab="purchases">🧾 المشتريات</button>
<button class="nav-tab" data-tab="sales">📦 المبيعات للمخزن</button>
<button class="nav-tab" data-tab="database">🗄 قواعد البيانات</button>
</div>
<div class="content">
<div id="daily" class="tab-content active"></div>
<div id="total" class="tab-content"></div>
<div id="purchases" class="tab-content"></div>
<div id="sales" class="tab-content"></div>
<div id="database" class="tab-content"></div>
</div>
</div>
<div id="privateApp" style="display:none"><div id="private"></div></div>
</div>
<button id="unified-all-global" onclick="unifiedExportAll()">📦 تصدير كله XLSX</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/pharmacy/googleSync.js?v=31"></script>
<script src="js/pharmacy/daily.js?v=31"></script>
<script src="js/pharmacy/total.js?v=31"></script>
<script src="js/pharmacy/purchases.js?v=31"></script>
<script src="js/pharmacy/sales.js?v=31"></script>
<script src="js/pharmacy/database.js?v=31"></script>
<script src="js/pharmacy/actions.js?v=31"></script>
<script src="js/private/private.js?v=31"></script>
<script src="js/private/masrofaty.js?v=31"></script>
<script src="js/private/dyon.js?v=31"></script>
<script src="js/private/hodor.js?v=31"></script>
<script src="js/private/notes.js?v=31"></script>
<script type="module" src="firebase-config.js?v=31"></script>
<script type="module" src="app.js?v=31"></script>

<script>
function getStore(n){try{return JSON.parse(localStorage.getItem(n))}catch(e){return null}}
function deepParse(v){try{if(typeof v==='string'){let t=v.trim();if(t.startsWith('{')||t.startsWith('['))return JSON.parse(t)}}catch(e){}return v}
function normalize(s){if(!s)return[];let a=Array.isArray(s)?s:Object.values(s);return a.map(v=>{let d=deepParse(v);if(typeof d==='string')d=deepParse(d);return d}).filter(Boolean)}
window.unifiedExportAll=function(){
 try{
  let wb=XLSX.utils.book_new();let store=getStore('dailyStore')||{};let r1=[['التاريخ','الموظف','الشيفت','العجز','المورد','القيمة']];
  Object.keys(store).forEach(k=>{let d=store[k];let arr=Array.isArray(d)?d:Object.values(d||{});let rows={};arr.forEach(it=>{if(!it||!it.id)return;let m=(it.id+'').match(/t1_r(\d+)_c(\d+)/);if(!m)return;let R=m[1],C=m[2];if(!rows[R])rows[R]={emp:'',shift:'',diff:'',sup:'',val:''};if(C==='1')rows[R].emp=it.val||'';if(C==='2')rows[R].shift=it.val||'';if(C==='3')rows[R].diff=it.val||'';if(C==='5')rows[R].sup=it.val||'';if(C==='6')rows[R].val=it.val||'';});Object.values(rows).forEach(x=>{if(x.emp||x.val)r1.push([k,x.emp,x.shift,x.diff,x.sup,x.val])})});
  if(r1.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r1),'1- اليومية');
  let purch=getStore('purchaseStore')||[];if(purch.length){let r=[['التاريخ','المورد','النوع','طريقة الدفع','القيمة']];purch.forEach(o=>r.push([o.date||'',o.supplier||'',o.type||'',o.pay||'',o.value||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'2- المشتريات')}
  XLSX.writeFile(wb,'Omar-Pro-'+new Date().toISOString().slice(0,10)+'.xlsx');alert('✅ '+wb.SheetNames.join('\n'))
 }catch(e){alert(e.message)}
};
function showTab(n){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));document.getElementById(n)?.classList.add('active');document.querySelector(`[data-tab="${n}"]`)?.classList.add('active');if(n==='daily'&&typeof renderDaily==='function')renderDaily();if(n==='total'&&typeof renderTotal==='function')renderTotal();if(n==='purchases'&&typeof renderPurchases==='function')renderPurchases();if(n==='sales'&&typeof renderSales==='function')renderSales();if(n==='database'&&typeof renderDatabase==='function')renderDatabase();}
function showTop(m){document.querySelectorAll('.top-btn').forEach(b=>b.classList.remove('active'));if(m==='pharmacy'){document.getElementById('pharmacyApp').style.display='block';document.getElementById('privateApp').style.display='none';document.querySelector('[data-top="pharmacy"]').classList.add('active');showTab('daily');}else{document.getElementById('pharmacyApp').style.display='none';document.getElementById('privateApp').style.display='block';document.querySelector('[data-top="private"]').classList.add('active');if(typeof renderPrivate==='function')renderPrivate();}}
document.querySelectorAll('.nav-tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));document.querySelectorAll('.top-btn').forEach(b=>b.addEventListener('click',()=>showTop(b.dataset.top)));
window.addEventListener('load',async()=>{if(typeof fetchSheetData==='function')await fetchSheetData();showTop('pharmacy');});
</script>
</body>
</html>
