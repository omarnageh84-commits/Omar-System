    <!-- 1. Firebase - لازم يبقى أول حاجة وقبل أي سكريبت تاني -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUuFRP12_gEp8WjVH582rOvX5JrBk4DA",
            authDomain: "omar-system-2026.firebaseapp.com",
            projectId: "omar-system-2026",
            storageBucket: "omar-system-2026.firebasestorage.app",
            messagingSenderId: "136389596066",
            appId: "1:136389596066:web:e8585b28fd81db06e818fb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const USER_ID = "omar_main";

        // نخليهم Global عشان باقي الملفات تستخدمهم
        window.db = db;
        window.USER_ID = USER_ID;
        window.fsDoc = doc;
        window.fsSetDoc = setDoc;
        window.fsGetDoc = getDoc;

        const statusEl = document.getElementById('cloudStatus');

        // دالة رفع ملف dailyStore_FINAL_2026.json مرة واحدة فقط
        window.uploadDailyStore = async () => {
            try {
                statusEl.textContent = '⏳ جاري رفع الملف للسحابة...';
                const res = await fetch('./dailyStore_FINAL_2026.json');
                if (!res.ok) throw new Error('ملف dailyStore_FINAL_2026.json مش موجود جنب index.html');
                const data = await res.json();
                await setDoc(doc(db, "users", USER_ID), { 
                    dailyStore: data,
                    privateStore: window.privateStore || {},
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                statusEl.textContent = '✅ اترفع! تقدر تمسح الملف دلوقتي';
                alert('✅ تم رفع dailyStore_FINAL_2026.json بنجاح للسحابة!\n\nدلوقتي تقدر تمسح الملف نهائياً من الفولدر.\nالنظام هيشتغل من السحابة بعد كده.');
                location.reload();
            } catch(e){ 
                statusEl.textContent = '❌ فشل الرفع';
                alert('خطأ: ' + e.message);
                console.error(e);
            }
        };

        // تحميل البيانات من السحابة أولاً
        async function loadFromCloud() {
            try {
                const snap = await getDoc(doc(db, "users", USER_ID));
                if(snap.exists()){
                    const cloudData = snap.data();
                    if(cloudData.dailyStore){
                        window.dailyStore = cloudData.dailyStore;
                        // نحطها في localStorage كمان كـ backup
                        localStorage.setItem('dailyStore', JSON.stringify(cloudData.dailyStore));
                        statusEl.textContent = '☁️ متصل بالسحابة - البيانات محملة';
                        console.log('✅ تم التحميل من Firebase');
                        statusEl.style.background = '#0a5c0a';
                        setTimeout(()=> statusEl.style.display='none', 3000);
                        return true;
                    }
                }
                // لو مفيش بيانات على السحابة، حاول تحمل من الملف المحلي
                console.log('مفيش بيانات على السحابة، بجرب الملف المحلي...');
                try {
                    const res = await fetch('./dailyStore_FINAL_2026.json');
                    if(res.ok){
                        const data = await res.json();
                        window.dailyStore = data;
                        statusEl.textContent = '⚠️ من الملف المحلي - اكتب uploadDailyStore() في الكونسول للرفع';
                        statusEl.style.background = '#8a6d00';
                        return false;
                    }
                } catch(e){}
                
                statusEl.textContent = '☁️ فارغ - جاهز للرفع';
                statusEl.style.background = '#333';
                return false;
            } catch(e){
                console.error('خطأ في التحميل من السحابة:', e);
                statusEl.textContent = '❌ مشكلة اتصال - شغال Offline';
                statusEl.style.background = '#7a0000';
                // fallback localStorage
                const local = localStorage.getItem('dailyStore');
                if(local) window.dailyStore = JSON.parse(local);
                return false;
            }
        }

        // دالة حفظ تلقائي لأي تغيير في dailyStore للسحابة
        window.saveToCloud = async (newData) => {
            try {
                if(newData) window.dailyStore = newData;
                if(!window.dailyStore) return;
                await setDoc(doc(db, "users", USER_ID), { 
                    dailyStore: window.dailyStore,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                localStorage.setItem('dailyStore', JSON.stringify(window.dailyStore));
                console.log('☁️ تم الحفظ في السحابة');
            } catch(e){ console.error('فشل الحفظ السحابي:', e); }
        };

        // حمّل قبل ما باقي السكريبتات تشتغل
        await loadFromCloud();
        
        // اعمل Event عشان باقي الملفات تعرف إن البيانات جاهزة
        window.dispatchEvent(new Event('cloudDataReady'));
    </script>

    <script src="js/private/dyon.js"></script>

    <script>
        function showTab(name) {
            document.querySelectorAll('#pharmacyApp .tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

            let target = document.getElementById(name);
            if (target) target.classList.add('active');
            document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');

            // ارسم تبويب واحد بس عشان اليومية متظهرش في الاجمالي
            if (name === 'daily' && typeof renderDaily === 'function') renderDaily();
            if (name === 'total' && typeof renderTotal === 'function') renderTotal();
            if (name === 'purchases' && typeof renderPurchases === 'function') renderPurchases();
            if (name === 'sales' && typeof renderSales === 'function') renderSales();
            if (name === 'database' && typeof renderDatabase === 'function') renderDatabase();
        }

        function showTop(mode) {
            document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
            if (mode === 'pharmacy') {
                document.getElementById('pharmacyApp').style.display = 'block';
                document.getElementById('privateApp').style.display = 'none';
                document.querySelector('[data-top="pharmacy"]').classList.add('active');
                showTab('daily');
            } else {
                document.getElementById('pharmacyApp').style.display = 'none';
                document.getElementById('privateApp').style.display = 'block';
                document.querySelector('[data-top="private"]').classList.add('active');
                if (typeof renderPrivate === 'function') renderPrivate();
            }
        }

        document.querySelectorAll('.nav-tab').forEach(btn => {
            btn.addEventListener('click', () => showTab(btn.dataset.tab));
        });
        document.querySelectorAll('.top-btn').forEach(btn => {
            btn.addEventListener('click', () => showTop(btn.dataset.top));
        });

        async function initApp() {
            if (typeof fetchSheetData === 'function') {
                await fetchSheetData();
            }
            showTop('pharmacy');
        }

        // استنى السحابة تحمل الأول وبعدين شغل التطبيق
        window.addEventListener('cloudDataReady', () => {
            initApp();
        });

        window.addEventListener('load', async () => {
            // لو السحابة اتأخرت أكثر من 3 ثواني شغل التطبيق Offline
            setTimeout(() => {
                if(!window.dailyStore){
                    console.log('تحميل Offline');
                    initApp();
                }
            }, 3000);
            
            // لو البيانات جاهزة أصلاً شغل
            if(window.dailyStore || localStorage.getItem('dailyStore')){
                initApp();
            }
        });

        // راقب أي تغيير في dailyStore واحفظه تلقائياً في السحابة
        let lastDailyStoreStr = '';
        setInterval(() => {
            if(window.dailyStore){
                const currentStr = JSON.stringify(window.dailyStore);
                if(currentStr !== lastDailyStoreStr && lastDailyStoreStr !== ''){
                    if(typeof saveToCloud === 'function') saveToCloud();
                }
                lastDailyStoreStr = currentStr;
            }
        }, 5000);
    </script>
