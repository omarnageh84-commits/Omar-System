<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar System</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pharmacy.css">
<link rel="stylesheet" href="css/private.css">
<style>.tab-content{display:none}.tab-content.active{display:block}#unified-all-global{position:fixed;bottom:20px;left:20px;z-index:999999;background:#7c3aed;color:#fff;border:none;padding:12px 22px;border-radius:30px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(124,58,237,.4)}</style>
</head>
<body>
<div class="app-container">
<div class="top-switch"><button class="top-btn active" data-top="pharmacy">💊 الصيدلية</button><button class="top-btn" data-top="private">الخاص</button></div>
<div id="pharmacyApp"><div class="nav-bar"><button class="nav-tab active" data-tab="daily">📅 اليومية</button><button class="nav-tab" data-tab="total">📊 الاجمالي</button><button class="nav-tab" data-tab="purchases">🧾 المشتريات</button><button class="nav-tab" data-tab="sales">📦 المبيعات للمخزن</button><button class="nav-tab" data-tab="database">🗄 قواعد البيانات</button></div><div class="content"><div id="daily" class="tab-content active"></div><div id="total" class="tab-content"></div><div id="purchases" class="tab-content"></div><div id="sales" class="tab-content"></div><div id="database" class="tab-content"></div></div></div>
<div id="privateApp" style="display:none"><div id="private"></div></div>
</div>
<button id="unified-all-global" onclick="unifiedExportAll()">📦 تصدير كله XLSX</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/pharmacy/googleSync.js?v=24"></script><script src="js/pharmacy/daily.js?v=24"></script><script src="js/pharmacy/total.js?v=24"></script><script src="js/pharmacy/purchases.js?v=24"></script><script src="js/pharmacy/sales.js?v=24"></script><script src="js/pharmacy/database.js?v=24"></script><script src="js/pharmacy/actions.js?v=24"></script>
<script src="js/private/private.js?v=24"></script><script src="js/private/masrofaty.js?v=24"></script><script src="js/private/dyon.js?v=24"></script><script src="js/private/hodor.js?v=24"></script><script src="js/private/notes.js?v=24"></script>
<script type="module" src="firebase-config.js?v=24"></script><script type="module" src="app.js?v=24"></script>

<script>
function getStore(n){try{let v=localStorage.getItem(n);if(v)return JSON.parse(v);}catch(e){}return null;}
function deepParse(v){try{if(typeof v==='string'&&v.trim().startsWith('{'))return JSON.parse(v);}catch(e){}return v;}
window.unifiedExportAll=function(){
 try{
  if(typeof XLSX==='undefined'){alert('استنى ثانيتين');return;}
  let wb=XLSX.utils.book_new();

  // الصيدلية - اليومية 211 يوم
  let store=getStore('dailyStore')||{}; let rows=[['التاريخ','الموظف','الشيفت','العجز','القيمة','المورد']];
  Object.keys(store).forEach(k=>{let d=store[k];let arr=Array.isArray(d)?d:Object.values(d||{});let empRows={};arr.forEach(it=>{if(!it||!it.id)return;let m=(it.id+'').match(/t1_r(\d+)_c(\d+)/);if(!m)return;let r=m[1],c=m[2];if(!empRows[r])empRows[r]={emp:'',shift:'',diff:'',sup:'',val:''};if(c==='1')empRows[r].emp=it.val||'';if(c==='2')empRows[r].shift=it.val||'';if(c==='3')empRows[r].diff=it.val||'';if(c==='5')empRows[r].sup=it.val||'';if(c==='6')empRows[r].val=it.val||'';});Object.values(empRows).forEach(r=>{if(r.emp||r.val)rows.push([k,r.emp,r.shift,r.diff,r.val,r.sup]);});});
  if(rows.length>1) XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'اليومية - 211 يوم');

  let purch=getStore('purchaseStore')||[]; if(purch.length){let rp=[['التاريخ','المورد','النوع','الدفع','القيمة']];purch.forEach(x=>rp.push([x.date||'',x.supplier||'',x.type||'',x.pay||'',x.value||'']));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rp),'المشتريات');}

  // الخاص - تفكيك عربي
  const mapHeaders = {id:'الكود', date:'التاريخ', bayan:'البيان', amount:'المبلغ', cat:'الفئة / الدكتور', pay:'طريقة الدفع', source:'المصدر', salary:'المرتب', value:'القيمة', type:'النوع', name:'الاسم', day:'اليوم', month:'الشهر'};
  function toArabicRows(list){
    if(!list.length) return null;
    let keys = Object.keys(list[0]);
    let arKeys = keys.map(k=>mapHeaders[k]||k);
    let r=[arKeys];
    list.forEach(o=> r.push(keys.map(k=>o[k]||'')) );
    return r;
  }

  let pStore=getStore('privateStore');
  if(pStore){
    let list=Array.isArray(pStore)?pStore:Object.values(pStore);
    list=list.map(deepParse).filter(o=>o&&typeof o==='object');
    if(list.length){
      let ar = toArabicRows(list);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ar),'مصروفاتي الخاصة');
    }
  }

  // باقي المفاتيح
  [
    ['masrofatySalary','المرتبات'],
    ['monthlyFixed_v16','المصاريف الثابتة'],
    ['dyon','الديون'],
    ['hodor','الحضور'],
    ['hodorConfig','اعدادات الحضور'],
    ['dailyCats_v16','التصنيفات']
  ].forEach(([key,label])=>{
    let s=getStore(key); if(!s) return;
    let arr=Array.isArray(s)?s:Object.values(s);
    arr=arr.map(deepParse).filter(Boolean);
    if(!arr.length) return;
    if(typeof arr[0]==='object'){
      let ar=toArabicRows(arr);
      if(ar) XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ar),label.slice(0,31));
    }
  });

  XLSX.writeFile(wb,'Omar-System-كامل-عربي-'+new Date().toISOString().slice(0,10)+'.xlsx');
  alert('✅ اتصدر عربي: '+wb.SheetNames.join(' - '));
 }catch(e){alert('خطأ: '+e.message);console.error(e);}
};
function showTab(n){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));document.getElementById(n)?.classList.add('active');document.querySelector(`[data-tab="${n}"]`)?.classList.add('active');}
function showTop(m){document.querySelectorAll('.top-btn').forEach(b=>b.classList.remove('active'));if(m==='pharmacy'){document.getElementById('pharmacyApp').style.display='block';document.getElementById('privateApp').style.display='none';document.querySelector('[data-top="pharmacy"]').classList.add('active');showTab('daily');}else{document.getElementById('pharmacyApp').style.display='none';document.getElementById('privateApp').style.display='block';document.querySelector('[data-top="private"]').classList.add('active');if(typeof renderPrivate==='function')renderPrivate();}}
document.querySelectorAll('.nav-tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));document.querySelectorAll('.top-btn').forEach(b=>b.addEventListener('click',()=>showTop(b.dataset.top)));
window.addEventListener('load',async()=>{if(typeof fetchSheetData==='function')await fetchSheetData();showTop('pharmacy');});
</script>
</body>
</html>
