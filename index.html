<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omar System</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pharmacy.css">
<link rel="stylesheet" href="css/private.css">
<style>
.tab-content{display:none}.tab-content.active{display:block}
#unified-all-global{position:fixed;bottom:20px;left:20px;z-index:999999;background:#7c3aed;color:#fff;border:none;padding:12px 22px;border-radius:30px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(124,58,237,.4)}
</style>
</head>
<body>
<div class="app-container">
<div class="top-switch">
<button class="top-btn active" data-top="pharmacy">💊 الصيدلية</button>
<button class="top-btn" data-top="private">الخاص</button>
</div>
<div id="pharmacyApp">
<div class="nav-bar" id="navBar">
<button class="nav-tab active" data-tab="daily">📅 اليومية</button>
<button class="nav-tab" data-tab="total">📊 الاجمالي</button>
<button class="nav-tab" data-tab="purchases">🧾 المشتريات</button>
<button class="nav-tab" data-tab="sales">📦 المبيعات للمخزن</button>
<button class="nav-tab" data-tab="database">🗄 قواعد البيانات</button>
</div>
<div class="content">
<div id="daily" class="tab-content active"></div>
<div id="total" class="tab-content"></div>
<div id="purchases" class="tab-content"></div>
<div id="sales" class="tab-content"></div>
<div id="database" class="tab-content"></div>
</div>
</div>
<div id="privateApp" style="display:none"><div id="private"></div></div>
</div>
<button id="unified-all-global" onclick="unifiedExportAll()">📦 تصدير كله XLSX</button>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/pharmacy/googleSync.js?v=20"></script>
<script src="js/pharmacy/daily.js?v=20"></script>
<script src="js/pharmacy/total.js?v=20"></script>
<script src="js/pharmacy/purchases.js?v=20"></script>
<script src="js/pharmacy/sales.js?v=20"></script>
<script src="js/pharmacy/database.js?v=20"></script>
<script src="js/pharmacy/actions.js?v=20"></script>
<script src="js/private/private.js?v=20"></script>
<script src="js/private/masrofaty.js?v=20"></script>
<script src="js/private/dyon.js?v=20"></script>
<script src="js/private/hodor.js?v=20"></script>
<script src="js/private/notes.js?v=20"></script>
<script type="module" src="firebase-config.js?v=20"></script>
<script type="module" src="app.js?v=20"></script>

<script>
function getStore(n){try{let v=localStorage.getItem(n);if(v)return JSON.parse(v);}catch(e){}return null;}
window.unifiedExportAll=function(){
 try{
  if(typeof XLSX==='undefined'){alert('استنى ثانيتين المكتبة بتحمل');return;}
  let wb=XLSX.utils.book_new();

  // 1- اليومية
  let store=getStore('dailyStore')||{};
  let rows=[['التاريخ','الموظف','الشيفت','العجز','القيمة','المورد']];
  Object.keys(store).forEach(dateKey=>{
   let data=store[dateKey]; let arr=Array.isArray(data)?data:Object.values(data||{});
   let empRows={};
   arr.forEach(it=>{
    if(!it||!it.id)return;
    let m=(it.id+'').match(/t1_r(\d+)_c(\d+)/); if(!m)return;
    let r=m[1],c=m[2];
    if(!empRows[r])empRows[r]={emp:'',shift:'',diff:'',sup:'',val:''};
    if(c==='1')empRows[r].emp=it.val||'';
    if(c==='2')empRows[r].shift=it.val||'';
    if(c==='3')empRows[r].diff=it.val||'';
    if(c==='5')empRows[r].sup=it.val||'';
    if(c==='6')empRows[r].val=it.val||'';
   });
   Object.values(empRows).forEach(r=>{if(r.emp||r.val)rows.push([dateKey,r.emp,r.shift,r.diff,r.val,r.sup]);});
  });
  if(rows.length>1) XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'اليومية - 211 يوم');

  // 2- المشتريات
  let purch=getStore('purchaseStore')||[];
  if(purch.length){
   let rp=[['التاريخ','المورد','النوع','الدفع','القيمة']];
   purch.forEach(x=>rp.push([x.date||'',x.supplier||'',x.type||'',x.pay||'',x.value||'']));
   XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rp),'المشتريات');
  }

  // 3- المبيعات للمخزن
  let sales=getStore('salesStore')||getStore('zakhStore')||[];
  if(sales.length){
    let arr=Array.isArray(sales)?sales:Object.values(sales);
    if(arr.length && typeof arr[0]==='object'){
      let h=Object.keys(arr[0]); let rp=[h]; arr.forEach(o=>rp.push(h.map(k=>o[k]||'')));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rp),'المبيعات للمخزن');
    }
  }

  // 4- قواعد البيانات
  let db=getStore('dbStore')||{};
  if(db.suppliers?.length){
   let r=[['المورد','التصنيف']]; db.suppliers.forEach(s=>r.push([s.name||'',s.category||'']));
   XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'الموردين');
  }
  if(db.employees?.length){
   let r=[['الموظفون']]; db.employees.forEach(e=>r.push([e.name||'']));
   XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'الموظفون');
  }
  if(db.asnaf?.length){
   let r=[['الصنف','السعر']]; db.asnaf.forEach(a=>r.push([a.name||'',a.price||'']));
   XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),'الاصناف');
  }

  // 5- الخاص - حتى لو فاضي
  const privateMap = {
    'مصروفاتي الخاصة':'masrofatyStore',
    'الديون':'dyonStore',
    'الحضور والانصراف':'hodorStore',
    'الملاحظات':'notesStore'
  };
  Object.entries(privateMap).forEach(([sheetName, key])=>{
    let s=getStore(key);
    if(!s){
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[sheetName+' - فاضي'],['مفيش بيانات مسجلة حاليا']]),sheetName.slice(0,31));
      return;
    }
    let arr=Array.isArray(s)?s:Object.values(s);
    if(!arr.length){
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[sheetName+' - فاضي'],['مفيش بيانات مسجلة حاليا']]),sheetName.slice(0,31));
      return;
    }
    if(typeof arr[0]==='object'){
      let h=Object.keys(arr[0]); let r=[h]; arr.forEach(o=>r.push(h.map(k=>o[k]||'')));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),sheetName.slice(0,31));
    } else {
      let r=[[sheetName]]; arr.forEach(v=>r.push([v]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),sheetName.slice(0,31));
    }
  });

  if(!wb.SheetNames.length){alert('مفيش داتا تتصدر');return;}
  XLSX.writeFile(wb,'Omar-System-كامل-بالخاص-'+new Date().toISOString().slice(0,10)+'.xlsx');
  alert('✅ اتصدر: '+wb.SheetNames.join(' - '));
 }catch(e){alert('خطأ: '+e.message);console.error(e);}
};

function showTab(name){
 document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
 document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
 document.getElementById(name)?.classList.add('active');
 document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');
 if(name==='daily'&&typeof renderDaily==='function')renderDaily();
 if(name==='total'&&typeof renderTotal==='function')renderTotal();
 if(name==='purchases'&&typeof renderPurchases==='function')renderPurchases();
 if(name==='sales'&&typeof renderSales==='function')renderSales();
 if(name==='database'&&typeof renderDatabase==='function')renderDatabase();
}
function showTop(mode){
 document.querySelectorAll('.top-btn').forEach(b=>b.classList.remove('active'));
 if(mode==='pharmacy'){
  document.getElementById('pharmacyApp').style.display='block';
  document.getElementById('privateApp').style.display='none';
  document.querySelector('[data-top="pharmacy"]').classList.add('active');
  showTab('daily');
 }else{
  document.getElementById('pharmacyApp').style.display='none';
  document.getElementById('privateApp').style.display='block';
  document.querySelector('[data-top="private"]').classList.add('active');
  if(typeof renderPrivate==='function')renderPrivate();
 }
}
document.querySelectorAll('.nav-tab').forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.tab)));
document.querySelectorAll('.top-btn').forEach(btn=>btn.addEventListener('click',()=>showTop(btn.dataset.top)));
window.addEventListener('load',async()=>{
 if(typeof fetchSheetData==='function')await fetchSheetData();
 showTop('pharmacy');
});
</script>
</body>
</html>
